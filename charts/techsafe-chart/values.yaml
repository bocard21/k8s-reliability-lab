global:
  environment: production
  imageRegistry: ""

networkMonitor:
  enabled: true
  replicaCount: 2
  image:
    repository: techsafe/network-monitor
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

securityAnalyzer:
  enabled: true
  replicaCount: 2
  image:
    repository: techsafe/security-analyzer
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

database:
  enabled: true
  image:
    repository: postgres
    tag: "15"
  service:
    port: 5432
  credentials:
    secretName: techsafe-db-secret
  storage:
    size: 10Gi
    storageClass: standard
