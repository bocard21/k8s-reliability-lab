{{- range $name, $cfg := dict "network-monitor" .Values.networkMonitor "security-analyzer" .Values.securityAnalyzer }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "techsafe.labels" $ | nindent 4 }}
spec:
  {{- if or (ne $name "network-monitor") (not $.Values.autoscaling.enabled) }}
  replicas: {{ $cfg.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      serviceAccountName: techsafe-sa
      containers:
        - name: {{ $name }}
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $cfg.service.port }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          env:
            - name: DB_HOST
              value: {{ $.Release.Name }}-postgres
            - name: DB_NAME
              value: techsafe_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.credentials.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.credentials.secretName }}
                  key: password
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}
{{- end }}
