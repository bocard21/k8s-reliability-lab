global:
  environment: development
  imageRegistry: ""

networkMonitor:
  enabled: true
  replicaCount: 2
  image:
    repository: k8s-reliability/network-monitor
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

securityAnalyzer:
  enabled: true
  replicaCount: 2
  image:
    repository: k8s-reliability/security-analyzer
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

database:
  enabled: true
  image:
    repository: postgres
    tag: "15"
  service:
    port: 5432
  credentials:
    secretName: techsafe-db-secret
  storage:
    size: 10Gi
    storageClass: standard

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
