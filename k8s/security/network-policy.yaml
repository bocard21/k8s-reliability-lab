apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techsafe-network-policy
  namespace: techsafe
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: techsafe
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: techsafe
    - ports:
        - port: 53
          protocol: UDP
