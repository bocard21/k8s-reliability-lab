apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: techsafe-vs
  namespace: techsafe
spec:
  hosts:
    - "techsafe.local"
  gateways:
    - techsafe-gateway
  http:
    - match:
        - uri:
            prefix: /monitor
      route:
        - destination:
            host: techsafe-network-monitor
            port:
              number: 8080
    - match:
        - uri:
            prefix: /security
      route:
        - destination:
            host: techsafe-security-analyzer
            port:
              number: 8081
