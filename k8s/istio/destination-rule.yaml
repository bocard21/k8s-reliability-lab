apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: techsafe-dr
  namespace: techsafe
spec:
  host: network-monitor
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
