apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-analyzer
  namespace: techsafe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-analyzer
  template:
    metadata:
      labels:
        app: security-analyzer
    spec:
      containers:
        - name: security-analyzer
          image: techsafe/security-analyzer:1.0.0
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
