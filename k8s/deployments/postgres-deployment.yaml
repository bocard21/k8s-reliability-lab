apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: techsafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 10
          env:
            - name: POSTGRES_DB
              value: techsafe_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: techsafe-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techsafe-db-secret
                  key: password
